<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prueba del mapa</title>
<!-- Prueba de la Caja Mapa en el navegador, con pinchos inventados. Se abre con la vista previa «mundi»:
     http://localhost:8126/setup/pruebas/mapa.html — no toca Supabase. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous">
<style>
  :root { color-scheme: light dark; --pared: #F3EAD7; --pin: #B23A2B; --deseo: #3D7A74; --visitado: #E2B85C;
    --visitado-borde: #8A6E4B; --tinta: #3B2F22; --tinta-2: #6B5843; --tinta-3: #9A8468; --sup: #FFFBF2; --postal: #FFFFFF; }
  html, body { height: 100%; margin: 0; font: 14px system-ui, sans-serif; background: var(--pared); color: var(--tinta); }
  @media (prefers-color-scheme: dark) {
    /* Los de «papel de noche» de la app: el mapa no los usa, sigue en Papel claro */
    :root { --pared: #1B1610; --pin: #E0533F; --deseo: #6DB3A8; --visitado: #B8862F; --visitado-borde: #E2B85C;
      --tinta: #F1E6D0; --tinta-2: #C9B89A; --tinta-3: #9C8A6E; --sup: #241E16; --postal: #EDE3CF; }
  }
  #mapa { position: fixed; inset: 0 0 64px 0; }
  #registro { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; overflow: auto; padding: 6px 12px; box-sizing: border-box;
    font: 12px ui-monospace, monospace; border-top: 1px solid rgba(127, 127, 127, .3); }
  #botones { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 3; }
  #botones button { font: inherit; padding: 6px 10px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
</head>
<body>
<div id="mapa"></div>
<div id="botones">
  <button id="encuadrar">Encuadrar</button>
  <button data-ir="40.4168,-3.7038">Madrid</button>
  <button data-ir="37.99,-1.13,10.5">Murcia</button>
  <button data-ir="38.085,-1.17,14">Altorreal</button>
  <button id="vacio">Sin pinchos</button>
  <button id="todos">Con pinchos</button>
</div>
<div id="registro">Cargando el mapa…</div>
<script type="module">
  import { crearMapa } from "../../mapa.js";

  // Solo en esta prueba: guarda el mapa de MapLibre en window.mapaML, para mirarlo desde la consola
  const MapaOriginal = maplibregl.Map;
  maplibregl.Map = class extends MapaOriginal {
    constructor(opciones) {
      super(opciones);
      window.mapaML = this;
    }
  };

  const registro = document.getElementById("registro");
  const anotar = (texto) => {
    const linea = document.createElement("div");
    linea.textContent = texto;
    registro.prepend(linea);
  };

  // Una foto inventada (un dibujo), como `portada`
  const foto = (color) => "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="92" height="84"><rect width="92" height="84" fill="${color}"/>` +
    `<circle cx="66" cy="22" r="11" fill="#FFF3B0"/><path d="M0 84 L30 44 L52 66 L70 50 L92 84 Z" fill="#3B5D4A"/></svg>`);
  // Lugares inventados para la prueba
  const pinchos = [
    { id: "p1", nombre: "Madrid", pais: "ES", lat: 40.4168, lon: -3.7038, portada: foto("#9CC3D5") },
    { id: "p1b", nombre: "Museo del Prado", pais: "ES", lat: 40.4138, lon: -3.6921 },
    { id: "p2", nombre: "París", pais: "FR", lat: 48.8566, lon: 2.3522, portada: foto("#D9B8C4") },
    { id: "p3", nombre: "Lyon", pais: "FR", lat: 45.764, lon: 4.8357,
      forma: { type: "Polygon", coordinates: [[[4.77, 45.71], [4.90, 45.71], [4.90, 45.81], [4.77, 45.81], [4.77, 45.71]]] } },
    { id: "p4", nombre: "Santorini", pais: "GR", lat: 36.3932, lon: 25.4615, portada: foto("#A7D3E8") },
    { id: "p5", nombre: "Santiago", pais: "CL", lat: -33.4489, lon: -70.6693 },
    { id: "p6", nombre: "Kioto", pais: "JP", lat: 35.0116, lon: 135.7681, estado: "quiero_ir" },
    { id: "p7", nombre: "Reikiavik", pais: "IS", lat: 64.1466, lon: -21.9426 },
    { id: "p8", nombre: "Altorreal", pais: "ES", lat: 38.0736, lon: -1.1685, portada: foto("#E8C987") },
    { id: "p9", nombre: "Forma rota", pais: "PT", lat: 38.7223, lon: -9.1393, forma: { type: "Polygon" } },
  ];

  try {
    const mapa = await crearMapa(document.getElementById("mapa"), {
      alTocarPincho: (p) => anotar(`Pincho: ${p.nombre} (${p.id})`),
      alTocarPunto: (punto) => {
        anotar(`Punto: ${punto.lat}, ${punto.lon} → ${punto.pais ?? "sin país"}`);
        mapa.marcarPunto(punto.lat, punto.lon);
      },
    });
    mapa.pintar(pinchos, { resaltar: "p4" });
    window.mapa = mapa;
    window.pinchosDePrueba = pinchos;
    document.getElementById("encuadrar").onclick = () => mapa.encuadrar();
    document.getElementById("vacio").onclick = () => mapa.pintar([]);
    document.getElementById("todos").onclick = () => mapa.pintar(pinchos);
    for (const b of document.querySelectorAll("[data-ir]")) {
      const [lat, lon, zoom] = b.dataset.ir.split(",").map(Number);
      b.onclick = () => (Number.isFinite(zoom) ? mapa.irA(lat, lon, zoom) : mapa.irA(lat, lon));
    }
    anotar("Mapa listo: toca un pincho, un grupo o un punto.");
  } catch (e) {
    anotar("Error: " + e.message);
  }
</script>
</body>
</html>
